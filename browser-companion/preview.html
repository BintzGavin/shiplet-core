<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review capture · Shiplet</title><link rel="stylesheet" href="style.css"><script type="module" src="preview.js"></script></head><body><main><p class="eyebrow">SHIPLET BROWSER COMPANION</p><h1>Review before sharing</h1><p>Drag over sensitive areas to redact them. Nothing has left your browser.</p><div class="canvas-wrap"><canvas aria-label="Capture preview; drag to redact"></canvas></div><div class="actions"><button id="reset" class="secondary">Reset redactions</button><button id="cancel" class="secondary">Discard capture</button></div><details><summary>Redact using coordinates</summary><div class="actions"><label>X<input id="x" type="number" min="0" value="0"></label><label>Y<input id="y" type="number" min="0" value="0"></label><label>Width<input id="width" type="number" min="0" value="0"></label><label>Height<input id="height" type="number" min="0" value="0"></label><button id="redact">Apply redaction</button></div></details><label>Original page URL (optional)<input id="source" type="url" maxlength="2048"></label><p>Queries and fragments are removed. Clear the URL if the path is private.</p><button id="share" disabled>Continue to Shiplet</button><p id="status" role="status">Loading your local preview…</p></main></body></html>
