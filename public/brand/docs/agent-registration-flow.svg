<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title>Connect an agent to Shiplet</title>
  <desc>An agent reads Shiplet auth.md and asks for access. A person signs in and chooses one Shiplet organization. The agent connects to Code Mode MCP and works with Shiplets and feedback within that organization's membership, grants, and permissions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3157ff"/>
      <stop offset="1" stop-color="#2442c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24315e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8290b5"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="34" fill="url(#background)"/>
  <text x="70" y="76" fill="#172036" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760">Connect an agent to Shiplet</text>
  <text x="70" y="112" fill="#5b6785" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19">You choose the organization. Shiplet keeps every agent action inside that boundary.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="350" height="190" rx="24" fill="url(#agent)"/>
    <circle cx="116" cy="218" r="22" fill="#ffffff" fill-opacity="0.18"/>
    <text x="116" y="226" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">1</text>
    <text x="106" y="276" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">Agent asks for access</text>
    <text x="106" y="312" fill="#dce4ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">shiplet.cc/auth.md</text>
    <text x="106" y="340" fill="#dce4ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">starts the browser approval</text>
  </g>

  <line x1="430" y1="265" x2="486" y2="265" stroke="#8290b5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="500" y="170" width="350" height="190" rx="24" fill="#fffaf1" stroke="#efcc88" stroke-width="2"/>
    <circle cx="546" cy="218" r="22" fill="#ffebbf"/>
    <text x="546" y="226" text-anchor="middle" fill="#8b5700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">2</text>
    <text x="536" y="276" fill="#533700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">You approve it</text>
    <text x="536" y="312" fill="#76571d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">sign in to Shiplet</text>
    <text x="536" y="340" fill="#76571d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">choose one organization</text>
  </g>

  <line x1="860" y1="265" x2="916" y2="265" stroke="#8290b5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="930" y="170" width="400" height="190" rx="24" fill="#ecfbf3" stroke="#9ad9b7" stroke-width="2"/>
    <circle cx="976" cy="218" r="22" fill="#c9f2dc"/>
    <text x="976" y="226" text-anchor="middle" fill="#12623b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">3</text>
    <text x="966" y="276" fill="#164e34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">Agent connects to Shiplet</text>
    <text x="966" y="312" fill="#397458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Code Mode MCP</text>
    <text x="966" y="340" fill="#397458" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">recorded as its own actor</text>
  </g>

  <rect x="70" y="435" width="1260" height="255" rx="24" fill="#172036"/>
  <text x="106" y="487" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="740">Inside the organization you chose</text>
  <text x="106" y="519" fill="#aeb9d5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Membership, Shiplet grants, and agent permissions apply to every operation.</text>

  <text x="106" y="574" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="720">Shiplets and feedback</text>
  <rect x="106" y="598" width="280" height="52" rx="16" fill="#263250" stroke="#4a5b83"/>
  <text x="246" y="630" text-anchor="middle" fill="#dce4ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Read and publish Shiplets</text>
  <rect x="406" y="598" width="280" height="52" rx="16" fill="#263250" stroke="#4a5b83"/>
  <text x="546" y="630" text-anchor="middle" fill="#dce4ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Read and write feedback</text>

  <rect x="920" y="551" width="370" height="99" rx="18" fill="#263250" stroke="#4a5b83"/>
  <text x="1105" y="586" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Code Mode MCP endpoint</text>
  <text x="1105" y="620" text-anchor="middle" fill="#aeb9d5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">shiplet.cc/api/mcp</text>
</svg>
